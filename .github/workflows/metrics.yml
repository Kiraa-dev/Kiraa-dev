name: Metrics
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # Übersicht: Profil, Aktivität, Repos
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kiraa-dev
          template: classic
          filename: metrics/overview.svg
          config_timezone: Europe/Berlin
          base: header, activity, community,
          base_indepth: yes
          commits_authoring: Kiraa-dev
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 8

      # Programmiersprachen
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kiraa-dev
          template: classic
          filename: metrics/languages.svg
          config_timezone: Europe/Berlin
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-si
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

      # Contribution-Kalender
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kiraa-dev
          template: classic
          filename: metrics/calendar.svg
          config_timezone: Europe/Berlin
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Coding Habits (Aktivitätszeiten)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kiraa-dev
          template: classic
          filename: metrics/habits.svg
          config_timezone: Europe/Berlin
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes

      # 📘 Repository Template: SilvaaX Showcase
      - uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kiraa-dev
          repo: SilvaaX
          template: repository
          filename: metrics/repository.svg
          config_timezone: Europe/Berlin
          base: header
          plugin_lines: yes
          plugin_languages: yes

      # 🌸 AniList Watch List & Reading List
      - uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kiraa-dev
          template: classic
          filename: metrics/anilist.svg
          config_timezone: Europe/Berlin
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: Silvaax
          plugin_anilist_medias: anime, manga
          plugin_anilist_sections: watching, reading
          plugin_anilist_limit: 4

      # 🕹️ Steam Gaming Activity
      - uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }
          user: Kiraa-dev
          template: classic
          filename: metrics/steam.svg
          config_timezone: Europe/Berlin
          base: ""
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_user: "76561199122713044"
          plugin_steam_sections: player, most-played, recently-played
