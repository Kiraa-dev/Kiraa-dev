name: Metrics
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # Übersicht: Profil, Aktivität, Repos
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kiraa-dev
          template: classic
          filename: metrics/overview.svg
          config_timezone: Europe/Berlin
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          commits_authoring: Kiraa-dev
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 8

      # Sprachen
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kiraa-dev
          template: classic
          filename: metrics/languages.svg
          config_timezone: Europe/Berlin
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

      # Contribution-Kalender
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kiraa-dev
          template: classic
          filename: metrics/calendar.svg
          config_timezone: Europe/Berlin
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Wann du am aktivsten bist
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Kiraa-dev
          template: classic
          filename: metrics/habits.svg
          config_timezone: Europe/Berlin
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
